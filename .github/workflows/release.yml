name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Provides the Yarn version from package.json's packageManager field
      - run: corepack enable

      - run: yarn install --immutable

      # Compiles and packages the extension as a .vsix file
      - run: yarn build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version-build.${{ github.run_number }}"
          gh release create "$tag" *.vsix --title "$tag" --target "$GITHUB_SHA" --generate-notes
